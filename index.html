<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Forte, Futuro Sustentável</title>
    <style>
        /* Cores baseadas no pedido (Verde Escuro ao Verde Claro) */
        :root {
            --verde-escuro: #0b2512;
            --verde-medio: #1e5631;
            --verde-folha: #4c9a2a;
            --verde-claro: #76ba1b;
            --verde-limao: #a8df65;
            --fundo-suave: #f4f9f4;
            --branco: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--fundo-suave);
            color: var(--verde-escuro);
            line-height: 1.6;
        }

        /* Topo do Site */
        header {
            background: linear-gradient(135deg, var(--verde-escuro), var(--verde-medio));
            color: var(--branco);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .container-nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .logo span {
            color: var(--verde-limao);
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: var(--branco);
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: var(--verde-limao);
        }

        /* Banner Principal */
        .hero {
            background: linear-gradient(rgba(11, 37, 18, 0.8), rgba(30, 86, 49, 0.7)), 
                        url('https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            color: var(--branco);
            padding: 100px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .hero p {
            font-size: 1.3rem;
            max-width: 800px;
            margin: 0 auto 30px;
        }

        /* Seções de Conteúdo */
        section {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .titulo-secao {
            text-align: center;
            font-size: 2.2rem;
            color: var(--verde-escuro);
            margin-bottom: 40px;
        }

        /* Cards/Pilares */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--branco);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            border-left: 5px solid var(--verde-folha);
        }

        .card h3 {
            color: var(--verde-medio);
            margin-bottom: 15px;
        }

        /* Área de Vídeo e Galeria */
        .conteudo-midia {
            background-color: #eaf4ec;
            padding: 60px 20px;
            border-radius: 15px;
            margin: 40px auto;
        }

        .video-box {
            max-width: 800px;
            margin: 0 auto 50px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            /* Mantém a proporção do vídeo de cinema */
            aspect-ratio: 16/9; 
        }

        .video-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .galeria-fotos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .foto-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            height: 220px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .foto-item:hover img {
            transform: scale(1.1);
        }

        .legenda {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--verde-escuro));
            color: var(--branco);
            padding: 15px;
            font-size: 1rem;
        }

        /* Rodapé */
        footer {
            background-color: var(--verde-escuro);
            color: var(--branco);
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
        }

        footer p {
            opacity: 0.8;
            font-size: 0.9rem;
        }
